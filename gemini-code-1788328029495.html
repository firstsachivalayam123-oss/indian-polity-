<!DOCTYPE html>
<html lang="te">
<head>
  <meta charset="UTF-8">
  <title>History MCQ Quiz</title>
  <script src="questions.js"></script>
  <style>
    /* Styling same ga untundhi */
    body { font-family: Arial, sans-serif; background-color: #f4f6f9; display: flex; justify-content: center; padding: 20px; }
    .quiz-card { background: white; padding: 25px; border-radius: 12px; box-shadow: 0 4px 10px rgba(0,0,0,0.1); width: 100%; max-width: 500px; }
    .option-btn { display: block; width: 100%; padding: 12px; margin: 8px 0; border: 1px solid #ccc; border-radius: 6px; background: #fff; cursor: pointer; text-align: left; font-size: 16px; }
    .option-btn:hover { background-color: #e9ecef; }
    .correct { background-color: #d4edda !important; border-color: #c3e6cb !important; }
    .wrong { background-color: #f8d7da !important; border-color: #f5c6cb !important; }
    .nav-btn { background-color: #007bff; color: white; border: none; padding: 10px 20px; border-radius: 6px; cursor: pointer; margin-top: 15px; font-size: 16px; }
    .hidden { display: none; }
  </style>
</head>
<body>

<div class="quiz-card">
  <h2>History Practice Quiz</h2>
  <div id="quiz-container">
    <h3 id="question-text">Loading...</h3>
    <div id="options-container"></div>
    <button id="next-btn" class="nav-btn hidden" onclick="nextQuestion()">Next Question</button>
  </div>
  <div id="result-container" class="hidden">
    <h3>Quiz Completed! 🎉</h3>
    <p id="score-text"></p>
    <button class="nav-btn" onclick="location.reload()">Restart Quiz</button>
  </div>
</div>

<script>
  let currentQuestionIndex = 0;
  let score = 0;

  function loadQuestions() {
    // Direct ga JS variable use cheskuntunnam
    if (typeof questions !== 'undefined' && questions.length > 0) {
      showQuestion();
    } else {
      document.getElementById('question-text').innerText = "Questions load kaaledhu. 'questions.js' file check cheyandi.";
    }
  }

  function showQuestion() {
    resetState();
    const currentQ = questions[currentQuestionIndex];
    document.getElementById('question-text').innerText = `${currentQuestionIndex + 1}. ${currentQ.question}`;

    const optionsContainer = document.getElementById('options-container');
    currentQ.options.forEach((opt, index) => {
      const button = document.createElement('button');
      button.innerText = opt;
      button.classList.add('option-btn');
      button.onclick = () => selectOption(button, index, currentQ.answer);
      optionsContainer.appendChild(button);
    });
  }

  function resetState() {
    document.getElementById('next-btn').classList.add('hidden');
    document.getElementById('options-container').innerHTML = '';
  }

  function selectOption(selectedBtn, selectedIndex, correctIndex) {
    const allBtns = document.querySelectorAll('.option-btn');
    allBtns.forEach(btn => btn.disabled = true);

    if (selectedIndex === correctIndex) {
      selectedBtn.classList.add('correct');
      score++;
    } else {
      selectedBtn.classList.add('wrong');
      allBtns[correctIndex].classList.add('correct');
    }
    document.getElementById('next-btn').classList.remove('hidden');
  }

  function nextQuestion() {
    currentQuestionIndex++;
    if (currentQuestionIndex < questions.length) {
      showQuestion();
    } else {
      showResult();
    }
  }

  function showResult() {
    document.getElementById('quiz-container').classList.add('hidden');
    document.getElementById('result-container').classList.remove('hidden');
    document.getElementById('score-text').innerText = `Mee Score: ${score} / ${questions.length}`;
  }

  // App start kaadaniki
  loadQuestions();
</script>

</body>
</html>
